spring.application.name=GenBank

# Dynamic Cloud PaaS Port Binding (Render, Heroku, Railway, AWS)
server.port=${PORT:8080}

# Database Config - Externalized for Docker and Cloud MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/genbank_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Load and Register Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (Production Ready)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# OTP Microservice Config (Docker container name or cloud microservice URL)
genbank.otp.service.url=${OTP_SERVICE_URL:http://127.0.0.1:8000/api/otp}

# Auto-launch browser (disabled by default for headless cloud servers)
genbank.auto-open-browser=${AUTO_OPEN_BROWSER:false}
