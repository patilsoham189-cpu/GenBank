spring.application.name=GenBank

#Database Config - Credentials externalized via environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/genbank_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:245687}

#Load and Register Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

#OTP Microservice Config
genbank.otp.service.url=http://127.0.0.1:8000/api/otp

#Auto-launch browser on startup
genbank.auto-open-browser=true
